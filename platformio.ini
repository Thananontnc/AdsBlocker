[platformio]
default_envs = nodemcuv2

; ESP8266 port. 4MB flash split as 1MB sketch + 3MB LittleFS (eagle.flash.4m3m.ld):
; the 3MB filesystem holds ~600k domains @ 5 bytes. Firmware OTA (dashboard upload) needs
; the new image to fit next to the running one, so keep the firmware under ~515KB.
[env]
platform = espressif8266
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m3m.ld
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp8266_exception_decoder
; lwIP without IPv6/extra features: smaller firmware so dashboard OTA keeps fitting
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH

; NodeMCU v2/v3 (ESP-12E/F, 4MB)
[env:nodemcuv2]
board = nodemcuv2

; Wemos/LOLIN D1 mini (4MB)
[env:d1_mini]
board = d1_mini
