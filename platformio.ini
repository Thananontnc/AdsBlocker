[platformio]
default_envs = nodemcuv2

; ESP8266 port. 4MB flash split as 1MB sketch + 3MB LittleFS (eagle.flash.4m3m.ld):
; the 3MB filesystem holds ~600k domains @ 5 bytes. Firmware OTA only works while the
; sketch fits in the ~512KB left free in the sketch area; otherwise flash over USB.
[env]
platform = espressif8266
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m3m.ld
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp8266_exception_decoder

; NodeMCU v2/v3 (ESP-12E/F, 4MB)
[env:nodemcuv2]
board = nodemcuv2

; Wemos/LOLIN D1 mini (4MB)
[env:d1_mini]
board = d1_mini
